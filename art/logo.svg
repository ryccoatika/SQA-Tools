<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="SQA Tools logo">
  <defs>
    <linearGradient id="bg" x1="40" y1="0" x2="472" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E45C8"/>
      <stop offset="0.48" stop-color="#4657E0"/>
      <stop offset="1" stop-color="#0AB489"/>
    </linearGradient>
    <radialGradient id="glow" cx="150" cy="120" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="430" cy="450" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#001A3A" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#001A3A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="150" y1="200" x2="380" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7A59"/>
      <stop offset="1" stop-color="#FB3F6E"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BFF3E4"/>
    </linearGradient>
    <clipPath id="squircle">
      <path d="M256,24 C120,24 24,120 24,256 C24,392 120,488 256,488 C392,488 488,392 488,256 C488,120 392,24 256,24 Z"/>
    </clipPath>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#001233" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Badge -->
  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <rect width="512" height="512" fill="url(#shade)"/>
    <path d="M-40,150 L250,-40 L360,-40 L-40,330 Z" fill="#FFFFFF" opacity="0.06"/>
  </g>
  <path d="M256,24 C120,24 24,120 24,256 C24,392 120,488 256,488 C392,488 488,392 488,256 C488,120 392,24 256,24 Z"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Ladybug -->
  <g filter="url(#drop)">
    <!-- Legs -->
    <g stroke="#20305C" stroke-width="13" stroke-linecap="round" fill="none">
      <path d="M150,252 L110,232"/>
      <path d="M138,314 L96,314"/>
      <path d="M150,376 L110,396"/>
      <path d="M362,252 L402,232"/>
      <path d="M374,314 L416,314"/>
      <path d="M362,376 L402,396"/>
    </g>
    <!-- Antennae -->
    <g stroke="#20305C" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M232,132 Q204,96 194,72"/>
      <path d="M280,132 Q308,96 318,72"/>
    </g>
    <circle cx="194" cy="70" r="11" fill="#0AB489"/>
    <circle cx="318" cy="70" r="11" fill="#0AB489"/>

    <!-- Body -->
    <ellipse cx="256" cy="312" rx="122" ry="128" fill="url(#body)"/>
    <!-- gloss -->
    <ellipse cx="212" cy="256" rx="58" ry="40" fill="#FFFFFF" opacity="0.20"/>
    <!-- wing seam -->
    <path d="M256,196 L256,434" stroke="#20305C" stroke-width="11" stroke-linecap="round"/>
    <!-- spots -->
    <g fill="#FFF4E8">
      <circle cx="204" cy="258" r="22"/>
      <circle cx="308" cy="258" r="22"/>
      <circle cx="196" cy="340" r="17"/>
      <circle cx="316" cy="340" r="17"/>
      <circle cx="238" cy="404" r="15"/>
      <circle cx="274" cy="404" r="15"/>
    </g>

    <!-- Head -->
    <circle cx="256" cy="170" r="48" fill="#22305F"/>
    <!-- Eyes -->
    <circle cx="237" cy="166" r="15" fill="#FFFFFF"/>
    <circle cx="275" cy="166" r="15" fill="#FFFFFF"/>
    <circle cx="240" cy="169" r="6.5" fill="#22305F"/>
    <circle cx="278" cy="169" r="6.5" fill="#22305F"/>
  </g>

  <!-- Sparkles -->
  <path d="M388,158 C390,172 396,178 410,180 C396,182 390,188 388,202 C386,188 380,182 366,180 C380,178 386,172 388,158 Z" fill="url(#spark)" opacity="0.9"/>
  <path d="M132,364 C133.5,374 138,378.5 148,380 C138,381.5 133.5,386 132,396 C130.5,386 126,381.5 116,380 C126,378.5 130.5,374 132,364 Z" fill="url(#spark)" opacity="0.75"/>
</svg>
