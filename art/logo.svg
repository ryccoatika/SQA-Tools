<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="SQA Tools logo">
  <defs>
    <linearGradient id="bg" x1="40" y1="0" x2="472" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E45C8"/>
      <stop offset="0.48" stop-color="#4657E0"/>
      <stop offset="1" stop-color="#0AB489"/>
    </linearGradient>
    <radialGradient id="glow" cx="150" cy="120" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="430" cy="450" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#001A3A" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#001A3A" stop-opacity="0"/>
    </radialGradient>
    <!-- Glossy metal rim -->
    <linearGradient id="rim" x1="150" y1="130" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#EDF1FF"/>
      <stop offset="1" stop-color="#B9C6EE"/>
    </linearGradient>
    <linearGradient id="handle" x1="300" y1="300" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F6FF"/>
      <stop offset="1" stop-color="#AEBBE6"/>
    </linearGradient>
    <linearGradient id="body" x1="176" y1="176" x2="266" y2="284" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7A59"/>
      <stop offset="1" stop-color="#FB3F6E"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BFF3E4"/>
    </linearGradient>
    <clipPath id="squircle">
      <path d="M256,24 C120,24 24,120 24,256 C24,392 120,488 256,488 C392,488 488,392 488,256 C488,120 392,24 256,24 Z"/>
    </clipPath>
    <clipPath id="lens">
      <circle cx="220" cy="214" r="105"/>
    </clipPath>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#001233" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Badge -->
  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <rect width="512" height="512" fill="url(#shade)"/>
    <path d="M-40,150 L250,-40 L360,-40 L-40,330 Z" fill="#FFFFFF" opacity="0.06"/>
  </g>
  <path d="M256,24 C120,24 24,120 24,256 C24,392 120,488 256,488 C392,488 488,392 488,256 C488,120 392,24 256,24 Z"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>

  <g filter="url(#drop)">
    <!-- Handle (behind lens) -->
    <g transform="rotate(45 360 352)">
      <rect x="296" y="334" width="132" height="36" rx="18" fill="url(#handle)"/>
      <rect x="308" y="339" width="104" height="7" rx="3.5" fill="#FFFFFF" opacity="0.5"/>
      <rect x="308" y="360" width="104" height="4" rx="2" fill="#4A5A8C" opacity="0.18"/>
    </g>

    <!-- Lens glass + inspected bug -->
    <g clip-path="url(#lens)">
      <circle cx="220" cy="214" r="105" fill="#EAF6FF" fill-opacity="0.14"/>

      <!-- legs -->
      <g stroke="#20305C" stroke-width="7" stroke-linecap="round" fill="none">
        <path d="M184,196 L162,185"/>
        <path d="M178,226 L154,226"/>
        <path d="M184,256 L162,267"/>
        <path d="M256,196 L278,185"/>
        <path d="M262,226 L286,226"/>
        <path d="M256,256 L278,267"/>
      </g>
      <!-- antennae -->
      <g stroke="#20305C" stroke-width="6" stroke-linecap="round" fill="none">
        <path d="M208,142 Q196,124 191,113"/>
        <path d="M232,142 Q244,124 249,113"/>
      </g>
      <circle cx="191" cy="111" r="5.5" fill="#0AB489"/>
      <circle cx="249" cy="111" r="5.5" fill="#0AB489"/>
      <!-- body -->
      <ellipse cx="220" cy="226" rx="48" ry="51" fill="url(#body)"/>
      <ellipse cx="203" cy="204" rx="22" ry="15" fill="#FFFFFF" opacity="0.22"/>
      <path d="M220,180 L220,275" stroke="#20305C" stroke-width="6" stroke-linecap="round"/>
      <g fill="#FFF4E8">
        <circle cx="201" cy="205" r="8.5"/>
        <circle cx="239" cy="205" r="8.5"/>
        <circle cx="198" cy="239" r="6.5"/>
        <circle cx="242" cy="239" r="6.5"/>
      </g>
      <!-- head -->
      <circle cx="220" cy="155" r="21" fill="#22305F"/>
      <circle cx="211" cy="153" r="6" fill="#FFFFFF"/>
      <circle cx="229" cy="153" r="6" fill="#FFFFFF"/>
      <circle cx="213" cy="155" r="2.8" fill="#22305F"/>
      <circle cx="231" cy="155" r="2.8" fill="#22305F"/>

      <!-- glass glints -->
      <path d="M150,176 L196,130" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.18"/>
      <path d="M170,200 L196,174" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.15"/>
    </g>

    <!-- Lens rim -->
    <circle cx="220" cy="214" r="117" fill="none" stroke="url(#rim)" stroke-width="22"/>
    <circle cx="220" cy="214" r="106" fill="none" stroke="#22305F" stroke-opacity="0.12" stroke-width="2"/>
    <circle cx="220" cy="214" r="129" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
  </g>

  <!-- Sparkles -->
  <path d="M402,148 C404,162 410,168 424,170 C410,172 404,178 402,192 C400,178 394,172 380,170 C394,168 400,162 402,148 Z" fill="url(#spark)" opacity="0.9"/>
  <path d="M118,356 C119.5,366 124,370.5 134,372 C124,373.5 119.5,378 118,388 C116.5,378 112,373.5 102,372 C112,370.5 116.5,366 118,356 Z" fill="url(#spark)" opacity="0.72"/>
</svg>
